name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip libffi-dev python3-dev openjdk-8-jdk

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: 36.1.0
          ndk: 25b
          
      - name: Install Python dependencies
        run: |
          pip install cython buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
