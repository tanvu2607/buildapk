name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip libffi-dev python3-dev openjdk-8-jdk
          pip install buildozer cython

      - name: Setup Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install cython

      - name: Build APK
        run: |
          buildozer init
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4  # ✅ ĐÃ SỬA: Dùng v4
        with:
          name: apk-file
          path: bin/*.apk
